name: CI

on:
  push:
    branches: [main, SF-Dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      # Puts cl, CMake and Ninja on PATH, as scripts/build.ps1 does locally.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Use the runner's vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null

      - name: Restore vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: cmake --preset release

      - name: Build
        shell: pwsh
        run: cmake --build --preset release

      - name: Test
        shell: pwsh
        run: ctest --preset release
