; CoSync-SF plugin configuration. Place next to CoSyncSF.dll in
; <Starfield>\Data\SFSE\Plugins\.
;
; Milestone 1: the plugin only establishes and logs the network session
; (Documents\My Games\Starfield\SFSE\Logs\CoSyncSF.log). It does not yet
; read or modify any game state.

[Network]
; off | host | client
Mode=off

; client mode: numeric address of a host or cosync-server
Address=127.0.0.1:37015

; host mode: UDP game port and LAN discovery port (0 disables discovery)
Port=37015
DiscoveryPort=37016
ServerName=CoSync-SF Session
MaxPlayers=8

[Player]
; 1-32 characters; must be unique within the session
Name=Player

[Security]
; Optional shared session password. Stored in plain text in this file.
Password=

[Experimental]
; 1 = spawn a stand-in actor for each remote player in your cell and move it
; to their position (Papyrus PlaceAtMe/SetPosition). May be unstable.
RemoteAvatars=0
; Debug: scale remote-player proxies (1.0 = normal) so they are easy to spot in tests.
AvatarScale=1.0
; Experiment: 1 = EnableAI(false) right after spawn. Leaves proxies semi-transparent (2026-11-02).
AvatarFreezeAI=0
; Experiment: 0 = do not move proxies (SetPosition/SetAngle at 10 Hz).
AvatarMove=1

[Debug]
; debug | info | warn | error
LogLevel=info
