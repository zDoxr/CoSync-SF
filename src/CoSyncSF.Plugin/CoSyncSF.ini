; CoSync-SF plugin configuration. Place next to CoSyncSF.dll in
; <Starfield>\Data\SFSE\Plugins\.
;
; Milestone 1: the plugin only establishes and logs the network session
; (Documents\My Games\Starfield\SFSE\Logs\CoSyncSF.log). It does not yet
; read or modify any game state.

[Network]
; off | host | client
Mode=off

; client mode: numeric address of a host or cosync-server
Address=127.0.0.1:37015

; host mode: UDP game port and LAN discovery port (0 disables discovery)
Port=37015
DiscoveryPort=37016
ServerName=CoSync-SF Session
MaxPlayers=8

[Player]
; 1-32 characters; must be unique within the session
Name=Player

[Security]
; Optional shared session password. Stored in plain text in this file.
Password=

[Debug]
; debug | info | warn | error
LogLevel=info
