; CoSync-SF plugin configuration. Place next to CoSyncSF.dll in
; <Starfield>\Data\SFSE\Plugins\.
;
; Milestone 1: the plugin only establishes and logs the network session
; (Documents\My Games\Starfield\SFSE\Logs\CoSyncSF.log). It does not yet
; read or modify any game state.

[Network]
; off | host | client
Mode=off

; client mode: numeric address of a host or cosync-server
Address=127.0.0.1:37015

; host mode: UDP game port and LAN discovery port (0 disables discovery)
Port=37015
DiscoveryPort=37016
ServerName=CoSync-SF Session
MaxPlayers=8

[Player]
; 1-32 characters; must be unique within the session
Name=Player

[Security]
; Optional shared session password. Stored in plain text in this file.
Password=

[Experimental]
; 1 = spawn a stand-in actor for each remote player in your cell and move it
; to their position (Papyrus PlaceAtMe/SetPosition). May be unstable.
RemoteAvatars=0
; Proxy base NPC: player = the player character's base (00000007), nearby = a random nearby NPC.
AvatarBase=player
; Debug: scale remote-player proxies (1.0 = normal) so they are easy to spot in tests.
AvatarScale=1.0
; Experiment: proxy AI. 0 = leave AI on; 1 = EnableAI(false) right after spawn (leaves proxies
; semi-transparent, 2026-11-02); 2 = EnableAI(false) AvatarFreezeDelay seconds after the 3D loads.
AvatarFreezeAI=0
AvatarFreezeDelay=3
; Diagnostics: 0 off; 1 = native animation probe (movement controller mode + graph variables of the
; player and proxies, logged on change) and player animation events; 2 = also floats at 2 Hz.
AvatarAnimDiag=0
; Experiment: drive the proxies' locomotion graph variables from their network velocity.
AvatarAnimate=0
; Experiment: 0 = do not move proxies (SetPosition/SetAngle at 10 Hz).
AvatarMove=1
; Proxy movement: teleport = SetPosition at 10 Hz (slides); motion = experiment: switch the proxy's
; movement controller to motion-driven (as the engine does for the player), then teleport;
; path = the engine moves the proxy
; toward an invisible marker on the remote position (walk/run animation).
AvatarMoveMode=teleport

[Debug]
; debug | info | warn | error
LogLevel=info
